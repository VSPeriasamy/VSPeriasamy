name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: VSPeriasamy
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23108981&color_dots=%232d3343,%23dbeafe,%23089182,%2322d3ee,%237c3aed
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322d3ee&color_dots=%232d3343,%231c3b4a,%23089182,%2322d3ee,%23a78bfa

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
